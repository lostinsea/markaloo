# Continuous integration for Markaloo.
#
# WHY THIS EXISTS: until it did, this repository had no CI on ordinary pushes
# at all. `release.yml` triggers only on a `v*` tag push or a manual dispatch,
# and the single test step it runs is `npm run test:packaging` - one of the
# three suites that execute under plain node. The ten windowed suites (tabs,
# security, popups, mermaid, visual, startup, search, patch, tables, theme)
# had therefore NEVER run anywhere but on the maintainer's machine, on the
# maintainer's memory. Roughly 1,850 assertions, including every
# render-security regression test, were guarded by a habit.
#
# test-packaging.js asserts that some workflow here still runs a suite that
# invokes `electron`, so this file cannot quietly regress to node-only checks.
# See R518.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_refresh:
        description: Run the single fixed hosted clean-refresh comparison after normal CI
        type: boolean
        required: false
        default: false

# A superseded run tells you nothing you want to wait for. Pushes to main land
# in bursts here, and the full chain is not cheap.
concurrency:
  # Ordinary CI must not cancel the finite comparison attempt.
  group: ${{ inputs.clean_refresh && format('clean-refresh-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.clean_refresh }}

permissions:
  contents: read

jobs:
  test:
    # Windows only, deliberately. Markaloo is a Windows-only fork - the packaging
    # suite pins the build targets and the docs say so - and the windowed suites
    # drive real BrowserWindows. Running them on ubuntu would need xvfb to say
    # anything at all, and would be testing a platform this fork does not ship.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # Pinned to full commit SHAs for the same reason release.yml is: a tag is
      # a mutable pointer controlled by someone else. The trailing comment
      # records the human-readable version, and .github/dependabot.yml keeps
      # these moving.
      - name: Check out full test history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The theme oracle reads frozen pre-refactor styles with git show.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc rather than a literal, so CI cannot drift from the version
          # the project is developed against. package.json declares
          # engines.node >= 22.12.0 and .npmrc sets engine-strict=true, so a
          # drift here fails at install time rather than confusingly later.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        id: install_dependencies
        # `npm ci`, not `npm install`: it installs exactly what the lockfile
        # pins and fails if the lockfile and package.json disagree.
        run: npm ci

      # Collect both regressions before npm test's fail-fast feature chain can
      # hide the second failure. Neither command's failure is waived.
      - name: Check Windows table editing and editor scrolling independently
        id: native_collection
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-test-results | Out-Null
          "table-cells=NOT-RUN`neditor-scroll=NOT-RUN`nshared-supplemental=NOT-RUN`nmermaid=NOT-RUN" | Set-Content ci-test-results\exit-codes.txt
          npm run test:table-cells 2>&1 | Tee-Object -FilePath ci-test-results\table-cells.log
          $tableExit = $LASTEXITCODE
          "table-cells=$tableExit`neditor-scroll=NOT-RUN`nshared-supplemental=NOT-RUN`nmermaid=NOT-RUN" | Set-Content ci-test-results\exit-codes.txt
          npm run test:editor-scroll 2>&1 | Tee-Object -FilePath ci-test-results\editor-scroll.log
          $scrollExit = $LASTEXITCODE
          "table-cells=$tableExit`neditor-scroll=$scrollExit`nshared-supplemental=NOT-RUN`nmermaid=NOT-RUN" | Set-Content ci-test-results\exit-codes.txt
          # A layout correction must also preserve actual Mermaid rendering.
          npm run test:mermaid 2>&1 | Tee-Object -FilePath ci-test-results\mermaid.log
          $mermaidExit = $LASTEXITCODE
          "table-cells=$tableExit`neditor-scroll=$scrollExit`nshared-supplemental=NOT-RUN`nmermaid=$mermaidExit" | Set-Content ci-test-results\exit-codes.txt
          $sharedSupplementalExit = "NOT-RUN"
          $inputReceiptPath = "screenshots\table-cell-editor\input\last-run.json"
          if ($tableExit -eq 0) {
            $sharedReason = "The full table command succeeded; no supplemental attempt."
          } elseif (Test-Path "screenshots\table-cell-editor\shared") {
            $sharedReason = "Shared has startup evidence; it must not be retried."
          } elseif (-not (Test-Path $inputReceiptPath)) {
            $sharedReason = "No Input exit receipt proves that the chain stopped before Shared."
          } else {
            $inputReceipt = $null
            $sharedReason = "Input does not record a failed exit; Shared was not retried."
            try {
              $inputReceipt = Get-Content -Raw $inputReceiptPath | ConvertFrom-Json -NoEnumerate -ErrorAction Stop
            } catch {
              $sharedReason = "Input receipt could not be read: $($_.Exception.Message)"
              Write-Warning $sharedReason
            }
            if ($null -ne $inputReceipt) {
              $code = $inputReceipt.detail.code
              if ($inputReceipt -is [System.Management.Automation.PSCustomObject] -and
                  $inputReceipt.detail -is [System.Management.Automation.PSCustomObject] -and
                  $inputReceipt.partition -is [string] -and $inputReceipt.partition -ceq "input" -and
                  $inputReceipt.stage -is [string] -and $inputReceipt.stage -ceq "exit" -and
                  ($code -is [int] -or $code -is [long]) -and $code -ne 0) {
                # Input's failed exit stops the existing && chain before Shared.
                $sharedReason = "Input exited $code before Shared; attempting Shared once."
                $sharedSupplementalExit = "STARTED"
                $sharedReason | Set-Content ci-test-results\shared-supplemental-status.txt
                "table-cells=$tableExit`neditor-scroll=$scrollExit`nshared-supplemental=$sharedSupplementalExit`nmermaid=$mermaidExit" | Set-Content ci-test-results\exit-codes.txt
                & .\node_modules\.bin\electron.cmd test\test-table-cell-editor.js --partition=shared 2>&1 |
                  Tee-Object -FilePath ci-test-results\table-cells-shared-supplemental.log
                $sharedSupplementalExit = $LASTEXITCODE
              }
            }
          }
          "exit=$sharedSupplementalExit`nreason=$sharedReason" | Set-Content ci-test-results\shared-supplemental-status.txt
          "table-cells=$tableExit`neditor-scroll=$scrollExit`nshared-supplemental=$sharedSupplementalExit`nmermaid=$mermaidExit" | Set-Content ci-test-results\exit-codes.txt
          if ($tableExit -ne 0 -or $scrollExit -ne 0 -or $mermaidExit -ne 0) { exit 1 }

      - name: Retain Windows table and scroll evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-regression-tests
          path: |
            ci-test-results/
            screenshots/table-cell-editor/
            screenshots/sentinel-error-*.png
            screenshots/editor-scroll-error-*.png
            screenshots/mermaid-*.png
            test/test-mermaid-results.txt
            tmp/editor-scroll/
          if-no-files-found: error
          retention-days: 7

      # Functional failures must not hide these checks. Refuse another actor
      # if command completion, process isolation or source restoration is unknown.
      - name: Check About history and prove selected repairs sequentially
        id: selected_proofs
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' && (steps.native_collection.outcome == 'success' || steps.native_collection.outcome == 'failure') }}
        shell: pwsh
        run: |
          "NOT-RUN" | Set-Content ci-test-results\about-status.txt
          "NOT-RUN" | Set-Content ci-test-results\selected-proofs-status.txt
          function Assert-NativeIsolation {
            try {
              $receipts = @(Get-Content ci-test-results\exit-codes.txt -ErrorAction Stop)
              foreach ($command in @("table-cells", "editor-scroll", "mermaid", "shared-supplemental")) {
                $completed = @($receipts | Where-Object { $_.StartsWith("$command=", [StringComparison]::Ordinal) })
                $valuePattern = if ($command -eq "shared-supplemental") { "(?:NOT-RUN|-?\d+)" } else { "-?\d+" }
                if ($completed.Count -ne 1 -or $completed[0] -notmatch "^$command=$valuePattern$") {
                  throw "Native isolation refused: $command has no unique returned-command exit receipt."
                }
              }
              $electronPath = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "node_modules\electron\dist\electron.exe"))
              $actors = @(Get-CimInstance Win32_Process -Filter "Name = 'electron.exe'" -ErrorAction Stop)
              foreach ($actor in $actors) {
                if ([string]::IsNullOrWhiteSpace($actor.ExecutablePath)) {
                  throw "Native isolation refused: Electron PID $($actor.ProcessId) has an unknown executable path."
                }
                if ([IO.Path]::GetFullPath($actor.ExecutablePath).Equals($electronPath, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Native isolation refused: owned Electron PID $($actor.ProcessId) is still running."
                }
              }
              git diff --quiet HEAD -- src scripts test package.json package-lock.json
              if ($LASTEXITCODE -ne 0) {
                throw "Native isolation refused: tracked application, test or proof files are changed or unreadable."
              }
              "Original commands returned; no owned Electron remains; tracked actor source diff is clean." |
                Add-Content ci-test-results\native-isolation.log
            } catch {
              "REFUSED: $($_.Exception.Message)" | Add-Content ci-test-results\native-isolation.log
              throw
            }
          }
          Assert-NativeIsolation
          "STARTED" | Set-Content ci-test-results\about-status.txt
          npm run test:updates 2>&1 | Tee-Object -FilePath ci-test-results\about.log
          $aboutExit = $LASTEXITCODE
          "exit=$aboutExit" | Set-Content ci-test-results\about-status.txt
          Assert-NativeIsolation
          "exit=STARTED`nR1025=STARTED`nR659=NOT-RUN" | Set-Content ci-test-results\selected-proofs-status.txt
          node scripts/prove-table-fixes.js R1025 2>&1 |
            Tee-Object -FilePath ci-test-results\selected-proofs.log
          $proofExit = $LASTEXITCODE
          $r1025Exit = $proofExit
          if ($r1025Exit -eq 0) {
            "exit=STARTED`nR1025=0`nR659=NOT-RUN" | Set-Content ci-test-results\selected-proofs-status.txt
            Assert-NativeIsolation
            "exit=STARTED`nR1025=0`nR659=STARTED" | Set-Content ci-test-results\selected-proofs-status.txt
            node scripts/prove-table-fixes.js R659 2>&1 |
              Tee-Object -FilePath ci-test-results\selected-proofs.log -Append
            $proofExit = $LASTEXITCODE
            "exit=$proofExit`nR1025=0`nR659=$proofExit" | Set-Content ci-test-results\selected-proofs-status.txt
          } else {
            "exit=$proofExit`nR1025=$r1025Exit`nR659=NOT-RUN" | Set-Content ci-test-results\selected-proofs-status.txt
          }
          if ($aboutExit -ne 0 -or $proofExit -ne 0) { exit 1 }

      - name: Retain selected regression proof evidence
        if: ${{ always() && steps.selected_proofs.outcome != '' && steps.selected_proofs.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-regression-proofs
          path: |
            ci-test-results/about-status.txt
            ci-test-results/about.log
            ci-test-results/native-isolation.log
            ci-test-results/selected-proofs-status.txt
            ci-test-results/selected-proofs.log
            ci-test-results/tabs-unusable.stdout.log
            ci-test-results/tabs-unusable.stderr.log
            screenshots/tab-refresh-FAILED.png
            tmp/about-updates/
          if-no-files-found: error
          retention-days: 7

      # Keep the full acceptance suite and existing audit gates. A failed
      # collection or proof still fails this job.
      - name: Run feature acceptance before the legacy suite
        run: npm test

      # Read-only and about a second, but it is the check that catches a revert
      # record whose anchor text has been edited out from under it - the failure
      # mode that makes the 460-odd recorded defects silently unprovable.
      - name: Verify every revert anchor still resolves
        run: node scripts/prove-table-fixes.js --anchors

  # THE OTHER HALF OF REVERT ROT, AND IT WAS NEVER CHECKED ANYWHERE. A revert
  # record is a PAIR: the anchor text it perturbs, and the assertion NAMES it
  # expects to fail (`expect`) or to keep passing (`mustPass`). The job above
  # checks only the first half. Renaming an assertion leaves the anchor intact,
  # so `--anchors` reports a clean sweep while the pairing is silently dead -
  # and an orphaned `mustPass` is the dangerous one, because it can never match,
  # so the COLLATERAL guard can never fire and the record reports PROVEN with
  # its guard quietly gone. This repository has already measured that happening:
  # rewriting two sections of test-theme.js orphaned seven regexes at once.
  #
  # `--expects` is the check for it. It runs each referenced suite ONCE on the
  # CLEAN tree and verifies every regex names a live assertion. It is READ-ONLY:
  # it exits before the harness reaches the mutation loop, so this audit never
  # rewrites the working tree. The fixed proof step above runs mutations
  # sequentially on its separate owned runner.
  #
  # A SEPARATE JOB, not a step, and that is deliberate: it runs the same suites
  # as `npm test`, so appending it there would double the wall clock for no
  # additional coverage. On its own runner it costs nothing the maintainer waits
  # for, and the two jobs cannot contend for one machine.
  revert-audit:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out full audit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --expects also executes the historical theme oracle.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify every expect/mustPass regex names a live assertion
        id: live_assertions
        run: node scripts/prove-table-fixes.js --expects

      - name: Retain unusable tab audit evidence
        if: ${{ always() && steps.live_assertions.outcome != '' && steps.live_assertions.outcome != 'skipped' && hashFiles('ci-test-results/tabs-unusable.*.log') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-tab-audit
          path: |
            ci-test-results/tabs-unusable.stdout.log
            ci-test-results/tabs-unusable.stderr.log
            screenshots/tab-refresh-FAILED.png
          if-no-files-found: error
          retention-days: 7

  clean-refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.clean_refresh
    needs: [test, revert-audit]
    runs-on: windows-latest
    timeout-minutes: 205
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - name: Check out the exact dispatched candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install the pinned dependencies
        run: npm ci

      - name: Run DATA-only transport controls
        run: node --test bench/clean-refresh/test-ci-integration.js

      - name: Predeclare the new environment and unchanged fixed method
        run: node bench/clean-refresh/prepare-ci.js

      - name: Run and qualify the sole AA attempt
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'markaloo-sec08-ci-results'
          & (Join-Path $PSHOME 'pwsh.exe') -NoProfile -NonInteractive -File (Join-Path $root 'invoke-phase.ps1') -Mode aa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $root 'verify-phase.js') aa

      - name: Run and verify the sole eligible AB attempt
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'markaloo-sec08-ci-results'
          & (Join-Path $PSHOME 'pwsh.exe') -NoProfile -NonInteractive -File (Join-Path $root 'invoke-phase.ps1') -Mode ab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $root 'verify-phase.js') ab

      - name: Retain actual outcomes, including failed or partial phases
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-refresh-comparison
          path: |
            ${{ runner.temp }}/markaloo-sec08-ci-results/*
            !${{ runner.temp }}/markaloo-sec08-ci-results/**/app/**
          if-no-files-found: error
